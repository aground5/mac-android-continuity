syntax = "proto3";

package peri.display.v1;

import "common.proto";
// ⚠ **이 import가 남아 있는 층 위반이다.**
//
// `ClientHello`가 `DisplayCaps`·`DecoderCaps`를 직접 들고 있어서 세션 계층이 확장 앱의
// 어휘를 안다. 원칙 1("세션 계층 소스에 display|video|capture|file이 없다")을 프로토콜에서
// 지키려면 이게 `map<uint32, bytes> app_caps`가 되어야 한다 — 세션은 "2번 앱이 이만큼의
// 불투명한 바이트를 보냈다"까지만 알고, 그걸 푸는 건 그 앱이다.
//
// 지금 안 바꾸는 이유: 협상은 이 코드베이스에서 가장 조심스러운 부분이고(HDR·AOA 상한·
// 회전), 그 변경은 Mux(와이어 v2)와 같이 가야 두 번 뜯지 않는다. 대신 위반을 **import 한
// 줄로 눈에 보이게** 남겨 둔다 — 주석보다 이게 오래간다.
import "extend.proto";

option java_package = "com.peri.display.proto";
option java_multiple_files = true;
option swift_prefix = "Peri";

// =============================================================================
// 세션 계층 — 신원·키·생존·앱 수명.
//
// 여기 있는 메시지들의 공통점: **어느 앱이 떠 있든 의미가 같다.** 핸드셰이크는 무엇을
// 스트리밍할지와 무관하고, Ping은 화면을 보내든 받든 1Hz로 흐르며, Bye는 앱이 하나도
// 안 떠 있어도 유효하다.
//
// 새 앱을 만들 때 이 파일은 **한 줄도 바뀌지 않아야 한다**(DESIGN.md 원칙 2).
// =============================================================================

// -----------------------------------------------------------------------------
// 1) 핸드셰이크 + 키 교환 — PQ-STS (Crypto Layer §3)
//    하이브리드: X25519 + ML-KEM-768 (FIPS 203), 상호 인증 = Ed25519 서명(봉인됨)
// -----------------------------------------------------------------------------

// PQ-STS (Station-to-Station) 3-pass. Android = 개시자(Alice), Mac = 응답자(Bob).
//
// 옛 방식(ClientHello/ServerHello/ClientAuth)과 무엇이 다른가
// ────────────────────────────────────────────────────────
//  ① **서명이 암호화된다.** 예전엔 서버 서명과 인증서가 ServerHello에 평문으로 실려서,
//     같은 망의 누구나 두 기기의 신원을 읽을 수 있었다. STS는 세션 키로 봉인하므로
//     수동 관찰자에게 "누가 누구와 붙는지"가 새지 않는다. 봉인 자체가 키 확인이기도 하다.
//
//  ② **서명이 협상 내용까지 덮는다.** 예전 전사 해시는 KEX 재료만 묶어서, 경로상의 공격자가
//     코덱 목록·해상도·HDR 지원·프로토콜 버전을 마음대로 고쳐도 서명이 그대로 검증됐다.
//     지금은 `core` 바이트 전체가 서명 대상이라 그 강등이 불가능하다.
//
// `core`가 왜 `bytes`인가
// ─────────────────────
// 서명 대상은 **선에 실제로 나간 바이트**여야 한다. 중첩 메시지로 두면 받은 쪽이 다시
// 직렬화해 해시해야 하는데, protobuf 재직렬화가 바이트 단위로 같다는 보장이 없다(미지 필드·
// 필드 순서). 불투명 바이트로 실으면 양쪽이 **같은 바이트**를 본다.

// Pass 1 재료 (Android → Mac). 이 메시지를 직렬화한 것이 `StsHello.core`다.
message StsHelloCore {
  uint32 protocol_version = 1;         // 현재 2 (STS)
  // 16B UUID — **이 라운드를 가리키는 이름일 뿐이다.**
  //
  // 예전엔 이 값이 UDP HELLO의 디먹스 키였다. 지금은 아니다: 데이터그램 경로는 세션과
  // 분리돼 앱이 필요할 때 열리고, 그때 Mac이 세대마다 새 `UdpOpen.channel_id`를 부여한다.
  // 여기 남은 역할은 전사에 덮여 **이 Pass 1의 재전송을 막는 것** 하나다.
  bytes  session_id = 2;
  bytes  x25519_pub = 3;               // X_A — 32B
  bytes  mlkem768_pub = 4;             // PK_A — ML-KEM-768 캡슐화 공개키
  string client_name = 5;              // 기기 표시명 (옵션)
  repeated VideoCodec supported_codecs = 6;  // 디코드 가능 코덱, 선호순
  DisplayCaps display = 7;             // (확장 앱 어휘 — 위 import 주석 참조)
  ClientNetwork network = 8;           // 접속 시점의 망 종류. 세션 도중 바뀌면 Ping이 갱신한다.
  // 디코더별 실제 한계. supported_codecs가 "무엇을 받는가"라면 이건 "어디까지 받는가"다.
  repeated DecoderCaps decoders = 9;
}

// Pass 1: Android → Mac (평문)
message StsHello {
  bytes core = 1;                      // 직렬화된 StsHelloCore — **이 바이트가 서명 대상**
}

// Pass 2 재료 (Mac → Android). 이 메시지를 직렬화한 것이 `StsResponse.core`다.
message StsResponseCore {
  uint32 protocol_version = 1;
  bytes  session_id = 2;               // StsHelloCore.session_id 에코
  bytes  x25519_pub = 3;               // X_B — 32B
  bytes  mlkem768_ciphertext = 4;      // ct_B — ML-KEM Encaps 결과
  string server_name = 5;
}

// Pass 2: Mac → Android (core는 평문, 신원은 봉인)
message StsResponse {
  bytes core = 1;                      // 직렬화된 StsResponseCore
  bytes sealed_auth = 2;               // [12B nonce][AEAD(StsAuth)] — K로 봉인
}

// Pass 3: Android → Mac. 상호 인증을 닫는다.
message StsConfirm {
  bytes sealed_auth = 1;               // [12B nonce][AEAD(StsAuth)] — K로 봉인
}

// `sealed_auth`를 열면 나오는 것.
//
// ★ **공개키를 싣지 않는다.** 검증자는 서명 대상(전사 해시)을 이미 알고 있으므로, 신뢰
// 저장소의 공개키를 하나씩 넣어 보면 누구인지 나온다 — 이 코드베이스가 UDP HELLO를 살아
// 있는 세션 키들로 시도복호화해 디먹스하는 것과 같은 방식이다. 페어링한 기기 수만큼(1~3)
// Ed25519 검증이 도는데 한 번에 수십 µs라 값이 안 나간다.
//
// 그래서 생기는 성질: **낯선 접속자는 아무것도 못 얻는다.** 아무나 붙어 KEX를 마치면 K를
// 갖게 되지만, 봉인을 풀어 봐야 나오는 건 **검증할 수 없는 64바이트**다. 공개키가 없으니
// 그게 누구 서명인지도 모른다. 인증서를 실을 때는 여기서 기기 이름과 지문이 그대로 샜다.
message StsAuth {
  // 케이블 부트스트랩 전용 — **무선에서는 반드시 비어 있다.**
  //
  // 상대가 나를 저장소에 갖고 있지 않은 경우가 딱 하나 있다: USB로 처음 붙는 순간. 그때는
  // 조회할 게 없어 신원을 실어야 한다. 케이블에는 지나가는 관찰자가 없으므로(듣는 쪽이 곧
  // 상대뿐) 위의 유출 논리가 적용되지 않는다.
  bytes identity_cert = 1;
  bytes signature = 2;                 // Ed25519(역할태그 ‖ 전사해시) — 항상 있다
}

// -----------------------------------------------------------------------------
// 2) 생존 (keepalive + 시각 동기)
// -----------------------------------------------------------------------------

// keepalive (1초 주기, 3회 무응답 시 RECOVERING)
message Ping {
  uint64 timestamp_us = 1;
  // ★ 현재 망 종류 — **ClientHello만으로는 부족해서** 여기 같이 싣는다.
  //
  // 무손실 재개(RESUME)는 세션을 유지한 채 전송만 갈아끼우므로, LTE↔Wi-Fi 전환에
  // 새 ClientHello가 없다. 핸드셰이크 때 값만 믿으면 표시가 영영 낡는다.
  // Ping은 1Hz로 항상 흐르는 유일한 상행 신호라 여기가 제자리다.
  ClientNetwork network = 2;
}

message Pong {
  uint64 timestamp_us = 1;             // Ping.timestamp_us 에코 (RTT 계산)
  // NTP 4-타임스탬프 클럭오프셋용 (지연 계측 파이프라인). host µs.
  uint64 mac_recv_us = 2;              // Mac이 Ping 수신한 시각 (t2)
  uint64 mac_send_us = 3;              // Mac이 이 Pong 송신하는 시각 (t3)
}

// -----------------------------------------------------------------------------
// 3) 세션 종료
// -----------------------------------------------------------------------------

// 양방향: 보낸 쪽이 이 세션을 *끝낸다*는 선언. 받은 쪽은 자동 재연결하지 않는다.
//
// "잠깐 끊김"과 "끝냄"을 구별하기 위해 존재한다. 끊김은 늘 일어나고(전송 전환·USB 글리치·
// 재접속) 그때 가상 디스플레이를 부수면 창이 이주하고 디스플레이 ID가 재사용되며 화면이
// 뒤바뀐다 — 그래서 Mac은 끊김만으로는 디스플레이를 유지한다. 이 메시지는 그 유예를 건너뛰고
// 즉시 정리해도 좋다는 확답이다.
//
// Android→Mac (USER_DISCONNECT/APP_EXIT): 기기가 떠난다 → Mac이 가상 디스플레이를 정리.
// Mac→Android (HOST_DISCONNECT): Mac이 끝냈다 → Android는 재접속 시도를 멈추고 대기
//   (안 그러면 keepalive 실패로 곧장 재접속해 세션이 되살아난다).
//
// **전송 전환(USB↔Wi-Fi)에서는 절대 보내지 않는다** — 그건 끝냄이 아니라 같은 기기의 경로 변경이다.
// (Android는 그 경우 controller.disconnect()가 아니라 bearer.disconnect()만 호출한다.)
message Bye {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    USER_DISCONNECT = 1;   // (Android→Mac) 사용자가 기기 앱에서 '끊기'
    APP_EXIT = 2;          // (Android→Mac) 기기 앱 종료
    HOST_DISCONNECT = 3;   // (Mac→Android) 사용자가 Mac에서 '연결 해제'
    // (Mac→Android) 신원 검증 실패 / 미페어링 — **재시도가 무의미하다**.
    //
    // 이게 없으면 Mac은 그냥 연결을 닫고, 클라이언트는 평범한 끊김과 구분하지 못해
    // 거부하는 Mac에게 영원히 재접속·재협상을 반복한다. 반대 방향(클라이언트가 Mac을 거부)은
    // 이미 치명 래치로 멈추므로, 이 값이 그 대칭을 완성한다.
    AUTH_REJECTED = 4;
  }
  Reason reason = 1;
}

// -----------------------------------------------------------------------------
// 4) 앱 수명 — 세션이 붙었다고 앱이 뜨지는 않는다.
// -----------------------------------------------------------------------------

// Mac → Android. **런처가 내리는 지시**다.
//
// 앱은 서로를 모르고 각자 독립적으로 뜨고 내린다 — 이 메시지에 "모드"가 없는 이유가 그거다.
// 동시에 못 도는 조합(확장 ∧ 공유)은 Mac의 런처가 애초에 막으므로 와이어에는 배타성이 없다.
message AppControl {
  AppId app = 1;
  bool  launch = 2;    // true=띄워라, false=내려라
  string reason = 3;   // 내릴 때만 — 사람이 읽는 사유
}

// Android → Mac. 그 앱이 자기 쪽에서 어떤 상태인지.
message AppState {
  AppId app = 1;
  bool  running = 2;
  string detail = 3;   // "동의 대기 중", "인코더 실패" 등
}

// -----------------------------------------------------------------------------
// 5) 데이터그램(UDP) 채널 — 세션이 아니라 **앱의 수명을 따른다.**
//
// 세션 수립은 TCP만으로 끝난다. UDP를 같이 열지 않는 이유는 순전히 NAT 때문이다:
//
//   · UDP 매핑은 수명이 짧다(흔히 30초 안팎, 캐리어 CGNAT은 더 짧다). 유지하려면
//     아무도 안 보는 동안에도 계속 두드려야 하고, 그건 무선 라디오를 계속 깨우는 일이다.
//   · TCP 매핑은 훨씬 오래 산다(분~시간 단위). 제어 채널 하나만 붙들고 있으면
//     세션은 값싸게 유지된다.
//
// 그래서 영상을 나르는 앱이 실제로 뜰 때만 UDP를 연다. 알림만 쓰는 세션은 UDP 소켓도
// NAT 매핑도 keepalive도 갖지 않는다. 경로가 끊겨도 BLE가 대역 밖에서 재수립을 돕기
// 때문에, UDP를 붙들고 있을 이유가 더 없다.
//
// **키 교환은 여기 없다.** 채널 키는 TCP에서 이미 합의한 세션 재료에서 `channel_id`를
// 소금으로 갈라 나온다 — 즉 양쪽이 이 메시지를 보는 순간 키를 갖게 되고, 첫 데이터그램이
// 곧바로 봉인돼 나간다(0-RTT). 세대마다 소금이 바뀌므로 채널을 닫았다 다시 열어도
// 예전 세대의 (키, nonce)와 겹치지 않는다.
// -----------------------------------------------------------------------------

// Mac → Android. "이 세션의 데이터그램 경로를 연다."
//
// **Mac이 부여한다.** 데이터그램은 연결이 없어 발신자를 스스로 증명하지 못하므로,
// 받는 쪽이 "이건 어느 세션의 것인가"를 먼저 알아야 열어 볼 키를 고를 수 있다.
// 제어 채널(TCP)은 이미 상호 인증돼 있으니 그 위에서 이름을 나눠 갖는 게 가장 싸다.
message UdpOpen {
  bytes channel_id = 1;   // 16B 난수. 세대마다 새로 뽑는다(키 유도의 소금이자 디먹스 키).
  // 직렬화된 후보 묶음(IceCandidate 텍스트 포맷). **비어 있으면 새 ICE 라운드가 없다** —
  // fast UDP 모드에서 접속 때 이미 뚫어 둔 경로를 그대로 쓴다는 뜻이다.
  bytes candidates = 2;
}

// Android → Mac. 후보를 되돌려주고 "열 준비가 됐다"고 알린다.
message UdpAccept {
  bytes channel_id = 1;   // 에코 — 이미 닫힌 세대의 늦은 응답을 가려낸다.
  bytes candidates = 2;
  string problem = 3;     // 비어 있지 않으면 열지 못한 이유(소켓 실패 등). 후보는 비어 온다.
}

// 양방향. "이 세대를 닫는다" — 키를 버리고 소켓·NAT 매핑을 놓는다.
//
// 닫는 걸 명시하는 이유: 안 보내면 상대는 그저 조용해진 것으로 보고 매핑을 붙들고 있는다.
// 그게 정확히 이 설계가 피하려는 상태다.
message UdpClose {
  bytes channel_id = 1;
  string reason = 2;
}
