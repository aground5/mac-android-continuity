syntax = "proto3";

package peri.display.v1;

option java_package = "com.peri.display.proto";
option java_multiple_files = true;
option swift_prefix = "Peri";

// =============================================================================
// Peri Display — 모두가 쓰는 어휘
//
// 여기 들어올 자격은 하나다: **둘 이상의 계층이 실제로 쓴다.** 어느 한 앱만 쓰는 값은
// 그 앱의 파일에 있어야 한다 — 여기 두는 순간 "공통"이라는 이름으로 그 앱의 사정이
// 세션 계층에 스며든다.
//
// 코덱 열거형이 애매한 예다. 지금은 확장과 공유가 **둘 다** 쓰므로 공통이 맞다.
// 셋째 앱이 코덱을 안 쓴다고 해서 이게 틀리는 건 아니다.
// =============================================================================

enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;  // 항상 지원 보장 (fallback)
  VIDEO_CODEC_H265 = 2;  // 협상 시 우선
  VIDEO_CODEC_VP9  = 3;  // v0.2+
  VIDEO_CODEC_AV1  = 4;  // 향후
}

enum BearerType {
  BEARER_TYPE_UNSPECIFIED = 0;
  BEARER_TYPE_USB = 1;  // AOA
  BEARER_TYPE_LAN = 2;  // TCP(control) + UDP(video)
  BEARER_TYPE_NAT = 3;  // STUN + UDP hole punch
}

enum Orientation {
  ORIENTATION_UNSPECIFIED = 0;
  ORIENTATION_PORTRAIT = 1;
  ORIENTATION_LANDSCAPE = 2;
}

// 스트림의 다이내믹 레인지. **세션 단위로 고정**이다 — 프레임마다 바뀌지 않으므로
// 영상 헤더(12B)가 아니라 제어 채널에서 한 번 확정한다(와이어 포맷 변경 없음).
//
// HDR은 10비트 코덱 프로파일을 요구하므로 H265(Main10)일 때만 성립한다. H264로 떨어지면
// 무조건 SDR이다.
enum DynamicRange {
  DYNAMIC_RANGE_UNSPECIFIED = 0;
  DYNAMIC_RANGE_SDR = 1;    // 8비트, sRGB/Rec.709
  DYNAMIC_RANGE_HDR10 = 2;  // 10비트, Rec.2020 primaries + PQ(SMPTE ST 2084)
  DYNAMIC_RANGE_HLG = 3;    // 10비트, Rec.2020 primaries + HLG(ARIB STD-B67)
}

// Android가 지금 어느 망을 타고 있는가 — **클라이언트만 알 수 있는 사실**이다.
//
// Mac은 피어 주소로 "같은 LAN인가"까지는 스스로 판정하지만, 공인 주소로 들어온 연결이
// 셀룰러인지 남의 Wi-Fi인지는 구분할 방법이 없다(둘 다 공인 IP 하나로 보인다).
// 그래서 클라이언트가 말해 준다. Mac은 이 값 + 피어 주소로 표시를 완성한다.
enum ClientNetwork {
  CLIENT_NETWORK_UNSPECIFIED = 0;  // 구버전 클라 또는 판정 실패
  CLIENT_NETWORK_WIFI = 1;
  CLIENT_NETWORK_CELLULAR = 2;     // LTE/5G — 지연·NAT 모두 최악이라 표시에서 구분한다
  CLIENT_NETWORK_ETHERNET = 3;     // USB 테더링 역방향, 도크 등
  CLIENT_NETWORK_OTHER = 4;
}

// 앱 식별자.
//
// **와이어 v2에서 Mux 조각 헤더의 service_id가 될 값**이라 번호를 미리 맞춘다(0 = 세션 자신).
// 그때가 되면 이 값이 봉투를 대체한다: 지금은 `ControlMessage`가 모든 앱의 메시지를 알아야
// 하지만, service_id가 생기면 세션은 "이 조각은 2번 앱 것"까지만 알고 내용은 안 본다.
enum AppId {
  APP_ID_UNSPECIFIED = 0;
  APP_ID_EXTEND = 1;   // Mac → Android 화면 확장
  APP_ID_SHARE = 2;    // Android → Mac 화면 공유
  APP_ID_FILES = 3;    // 파일 전송 (아직 없음)
  APP_ID_NOTIFY = 4;   // Android → Mac 알림
}
